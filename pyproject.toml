[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apixaban-model"
version = "0.8.0"
description = "This repository provides the apixaban physiologically based pharmacokinetic/pharmacodynamic (PBPK/PD) model: the absorption, the hepatic metabolism by CYP3A4, the renal excretion and the intestinal secretion of apixaban, its metabolites and the anticoagulant effects (anti-factor Xa activity, INR, PT, aPTT)."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Myshkina, Mariia" },
    { name = "Chang, Linh" },
    { name = "Metternich, Johannes" },
    { name = "Badon, Shelee" },
    { name = "Babaeva, Mariia" },
    { name = "Elias, Michelle" },
    { name = "König, Matthias" },
]
keywords = [
    "model",
    "apixaban",
    "factor Xa inhibitor",
    "anticoagulation",
    "pharmacokinetics",
    "pharmacodynamics",
    "PBPK/PD",
    "physiologically based pharmacokinetic/ pharmacodynamic model",
    "SBML",
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "pymetadata>=0.8.3",
    "sbmlutils>=0.17.2",
    "sbmlode>=0.3.2",
    "sbmlsim>=0.23.0",
    "pkpdutils>=1.4.0",
    "pkpdsim>=0.25.0",
    "libroadrunner>=2.11.1.dev655",
    "python-libsbml>=5.21.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "xarray>=2026.9.0",
    "pint>=0.26.2",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "pillow>=13.0.0",
    "rich>=15.0.0",
    "petab>=0.10.0",
    "scikit-learn>=1.9.1",
    "typst>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/matthiaskoenig/apixaban-model"
Repository = "https://github.com/matthiaskoenig/apixaban-model"
Documentation = "https://matthiaskoenig.github.io/apixaban-model/"
Issues = "https://github.com/matthiaskoenig/apixaban-model/issues"

[dependency-groups]
docs = ["zensical"]

[tool.hatch.build.targets.wheel]
packages = ["src/pkdb_models"]

