[project]
site_name = "Physiologically based pharmacokinetic/pharmacodynamic (PBPK/PD) model of apixaban"
site_url = "https://matthiaskoenig.github.io/apixaban-model/"
site_description = "This repository provides the apixaban physiologically based pharmacokinetic/pharmacodynamic (PBPK/PD) model: the absorption, the hepatic metabolism by CYP3A4, the renal excretion and the intestinal secretion of apixaban, its metabolites and the anticoagulant effects (anti-factor Xa activity, INR, PT, aPTT)."
site_author = "Mariia Myshkina, Linh Chang, Johannes Metternich, Shelee Badon, Mariia Babaeva, Michelle Elias and Matthias König"

copyright = "Copyright &copy; 2025-2026 Mariia Myshkina, Linh Chang, Johannes Metternich, Shelee Badon, Mariia Babaeva, Michelle Elias and Matthias König"

# pages as `simulations.html`, so the reports which the docs workflow copies into
# the site (`simulations/`, `fit/`) do not replace the pages of the same name
use_directory_urls = false

repo_url = "https://github.com/matthiaskoenig/apixaban-model"
repo_name = "matthiaskoenig/apixaban-model"

nav = [
  { "Home" = "index.md" },
  { "Running the model" = "running.md" },
  { "Models" = "models.md" },
  { "Simulations" = "simulations.md" },
  { "Fit" = "fit.md" },
  { "Credibility" = "credibility.md" },
  { "Release notes" = "release-notes.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/apixaban-model"
